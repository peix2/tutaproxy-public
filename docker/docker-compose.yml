services:
  tutaproxy:
    build:
      context: ..          # katalog projektu (gdzie jest requirements.txt, tuta/, run_proxy.py)
      dockerfile: docker/Dockerfile
    image: tutaproxy:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1143:1143"    # IMAP    — tylko localhost hosta, nie z sieci
      - "127.0.0.1:1025:1025"    # SMTP    — tylko localhost hosta, nie z sieci
      - "127.0.0.1:5232:5232"    # CalDAV  — tylko localhost hosta, nie z sieci
      - "127.0.0.1:5233:5233"    # CardDAV — tylko localhost hosta, nie z sieci
      - "127.0.0.1:5234:5234"    # WebDAV  — tylko localhost hosta, nie z sieci
    volumes:
      - tuta_cache:/data
    environment:
      LOG_LEVEL: INFO
      TZ: Pacific/Auckland
      # Gdy Tuta zbumpuje wersję API, nadpisz tu bez przebudowania obrazu:
      # TUTA_SYS_VERSION: "150"
      # TUTA_TUTANOTA_VERSION: "108"
      # TUTA_STORAGE_VERSION: "14"
      # TUTA_CLIENT_VERSION: "346.260428.0"

volumes:
  tuta_cache:
